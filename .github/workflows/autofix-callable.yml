name: PR Autofix (callable)

# Reusable workflow — call from your CI when a PR fails.
#
# Usage in your ci.yml:
#
#   autofix:
#     needs: [ci]                   # jobs that must run first
#     if: |
#       always() &&
#       github.event_name == 'pull_request' &&
#       !github.event.pull_request.draft &&
#       needs.ci.result == 'failure' &&
#       !startsWith(github.head_ref, 'fix/ci-')
#     permissions:
#       contents: write
#       pull-requests: write
#     uses: trained-assist/pr-autofix/.github/workflows/autofix-callable.yml@v1
#     with:
#       pr_number: ${{ github.event.pull_request.number }}
#       original_branch: ${{ github.head_ref }}
#       run_id: ${{ github.run_id }}
#     secrets:
#       openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
#       opencode_go_api_key: ${{ secrets.OPENCODE_GO_API_KEY }}   # optional, tried first
#       gh_token: ${{ secrets.AUTOFIX_PAT || github.token }}
#
# Required secrets in your repo:
#   OPENROUTER_API_KEY  — get a free key at https://openrouter.ai
#   OPENCODE_GO_API_KEY — optional; OpenCode Go subscription key. When set, the
#                         Go gateway is the primary provider and OpenRouter is
#                         the fallback. At least one of the two is required.
#   AUTOFIX_PAT        — Fine-Grained PAT with contents+pull_requests write on this repo
#                        (GITHUB_TOKEN can't create PRs when org restricts workflow write)

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'PR number that failed CI'
        required: true
        type: number
      original_branch:
        description: 'Branch name of the failing PR'
        required: true
        type: string
      run_id:
        description: 'GitHub Actions run ID of the failed CI run (pass 0 for batch/merge mode)'
        required: false
        type: string
        default: '0'
    secrets:
      openrouter_api_key:
        description: 'OpenRouter API key (free tier is sufficient). Fallback when opencode_go_api_key is set.'
        required: false
      opencode_go_api_key:
        description: 'OpenCode Go gateway key — primary provider when set'
        required: false
      gh_token:
        description: 'GitHub token with contents+pull_requests write (defaults to GITHUB_TOKEN)'
        required: false

jobs:
  autofix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Guard against duplicate fix PRs
        id: guard
        env:
          GH_TOKEN: ${{ secrets.gh_token || github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.original_branch }}
        run: |
          SAFE_BRANCH=$(echo "$BRANCH" | tr '/' '-' | sed 's/[^a-zA-Z0-9-]/-/g' | cut -c1-40)
          EXISTING=$(gh pr list -R "$REPO" \
            --json number,headRefName --state open \
            | jq -r ".[] | select(.headRefName | startswith(\"fix/ci-${SAFE_BRANCH}-\")) | .number" \
            | head -1)
          if [ -n "$EXISTING" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already have open fix PR #$EXISTING for branch $BRANCH — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip == 'false'
        with:
          ref: ${{ inputs.original_branch }}
          fetch-depth: 0
          token: ${{ secrets.gh_token || github.token }}

      - name: Download autofix script
        if: steps.guard.outputs.skip == 'false'
        env:
          # Pin the script to THIS reusable workflow's own version, never to a moving
          # `main`. The `job` context (not `github`) describes the workflow file that
          # defines this job: inside a reusable workflow `github.workflow_ref` is the
          # CALLER's workflow (e.g. .../ci.yml@refs/pull/1435/merge), so fetching
          # `scripts/autofix.mjs` from this repo at that ref 404s and autofix never runs.
          # job.workflow_repository + job.workflow_sha identify the exact
          # autofix-callable.yml commit the consumer invoked (e.g. @v1.2).
          WORKFLOW_REPO: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          if [ -z "$WORKFLOW_REPO" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "Could not resolve reusable-workflow identity (repo='$WORKFLOW_REPO' sha='$WORKFLOW_SHA') — refusing to fall back to main" >&2
            exit 1
          fi
          echo "Fetching autofix.mjs from $WORKFLOW_REPO@$WORKFLOW_SHA ($WORKFLOW_REF)"
          curl -fsSL \
            "https://raw.githubusercontent.com/${WORKFLOW_REPO}/${WORKFLOW_SHA}/scripts/autofix.mjs" \
            -o /tmp/autofix.mjs
          node --check /tmp/autofix.mjs && echo "script syntax OK"

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip == 'false'
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.guard.outputs.skip == 'false'
        run: npm ci --ignore-scripts

      - name: Run autofix pipeline
        id: autofix
        if: steps.guard.outputs.skip == 'false'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.openrouter_api_key }}
          OPENCODE_GO_API_KEY: ${{ secrets.opencode_go_api_key }}
          GH_TOKEN: ${{ secrets.gh_token || github.token }}
          RUN_ID: ${{ inputs.run_id }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ORIGINAL_BRANCH: ${{ inputs.original_branch }}
          # Optional repo variable: another OpenRouter id, or `free` for free-first.
          AUTOFIX_PRIMARY_MODEL: ${{ vars.AUTOFIX_PRIMARY_MODEL }}
        run: node /tmp/autofix.mjs

      - name: Report unfixed failure
        if: steps.guard.outputs.skip == 'false' && steps.autofix.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.gh_token || github.token }}
          REPO: ${{ github.repository }}
        run: |
          REASON=$(node -e "
            try {
              const s = JSON.parse(require('fs').readFileSync('ci-fixer-stats.json','utf8'));
              process.stdout.write(s.reason || s.category || 'unknown');
            } catch { process.stdout.write('unknown'); }
          " 2>/dev/null || echo "unknown")
          gh pr comment ${{ inputs.pr_number }} -R "$REPO" --body \
            "🤖 Auto-fix pipeline could not resolve this CI failure. Reason: \`${REASON}\`. Needs a human look."

      - name: Upload stats artifact
        if: steps.guard.outputs.skip == 'false' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-fixer-stats-pr${{ inputs.pr_number }}-run${{ github.run_id }}
          path: ci-fixer-stats.json
          if-no-files-found: ignore
          retention-days: 90
