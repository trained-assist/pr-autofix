name: PR Autofix (callable)

# Reusable workflow — call from your CI when a PR fails.
#
# Usage in your ci.yml:
#
#   autofix:
#     needs: [ci]                   # jobs that must run first
#     if: |
#       always() &&
#       github.event_name == 'pull_request' &&
#       !github.event.pull_request.draft &&
#       needs.ci.result == 'failure' &&
#       !startsWith(github.head_ref, 'fix/ci-')
#     permissions:
#       contents: write
#       pull-requests: write
#     uses: trained-assist/pr-autofix/.github/workflows/autofix-callable.yml@v1
#     with:
#       pr_number: ${{ github.event.pull_request.number }}
#       original_branch: ${{ github.head_ref }}
#       run_id: ${{ github.run_id }}
#     secrets:
#       llm_ladder_token: ${{ secrets.LLM_LADDER_TOKEN }}
#       gh_token: ${{ secrets.AUTOFIX_PAT || github.token }}
#
# Required secrets in your repo (org-level in trained-assist):
#   LLM_LADDER_TOKEN   — bearer token for the trained-assist-llm-ladder worker
#                        (https://llm-ladder.trainedassist.store). Every model call goes there
#                        (model `free-ladder`: OpenCode Go → OpenRouter :free); provider keys
#                        and failover live in the worker, not here.
#   AUTOFIX_PAT        — Fine-Grained PAT with contents+pull_requests write on this repo
#                        (GITHUB_TOKEN can't create PRs when org restricts workflow write)

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'PR number that failed CI'
        required: true
        type: number
      original_branch:
        description: 'Branch name of the failing PR'
        required: true
        type: string
      run_id:
        description: 'GitHub Actions run ID of the failed CI run (pass 0 for batch/merge mode)'
        required: false
        type: string
        default: '0'
    secrets:
      llm_ladder_token:
        description: 'Bearer token for the trained-assist-llm-ladder worker — all model calls go there'
        required: false
      openrouter_api_key:
        description: 'DEPRECATED (v1.6.0): ignored — model calls go through the llm-ladder worker'
        required: false
      opencode_go_api_key:
        description: 'DEPRECATED (v1.6.0): ignored — model calls go through the llm-ladder worker'
        required: false
      gh_token:
        description: 'GitHub token with contents+pull_requests write (defaults to GITHUB_TOKEN)'
        required: false

jobs:
  autofix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Guard against duplicate fix PRs
        id: guard
        env:
          GH_TOKEN: ${{ secrets.gh_token || github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.original_branch }}
        run: |
          SAFE_BRANCH=$(echo "$BRANCH" | tr '/' '-' | sed 's/[^a-zA-Z0-9-]/-/g' | cut -c1-40)
          EXISTING=$(gh pr list -R "$REPO" \
            --json number,headRefName --state open \
            | jq -r ".[] | select(.headRefName | startswith(\"fix/ci-${SAFE_BRANCH}-\")) | .number" \
            | head -1)
          if [ -n "$EXISTING" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already have open fix PR #$EXISTING for branch $BRANCH — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip == 'false'
        with:
          ref: ${{ inputs.original_branch }}
          fetch-depth: 0
          token: ${{ secrets.gh_token || github.token }}

      # R1 — THE DELIVERY BOUNDARY. This step used to download ONE file
      # (`curl … /scripts/autofix.mjs -o /tmp/autofix.mjs`) and "prove" it with `node --check`,
      # a check that parses a single file and never resolves imports. The day autofix.mjs gained
      # its first relative import, every consumer would have run a script that could not start
      # behind a green check — exactly the R2 class, one workflow over. The same mechanism as
      # ci-fix-cleanup.yml / devbaseline-callable.yml now delivers the TREE of the commit this
      # workflow was called at: every relative import comes with it, so no file list exists to go
      # stale. The `job` context (not `github`) identifies the workflow that DEFINES this job:
      # inside a reusable workflow `github.workflow_ref` is the CALLER's workflow, and fetching
      # from that ref 404s — autofix would never run. persist-credentials: false leaves no token
      # in the clone; the caller token is still used by the `actions/checkout` step above.
      # R1 — THE DELIVERY BOUNDARY (pr-autofix#61, #67). Two facts about the runner decide this
      # step, and both were learned the hard way:
      #   1. actions/checkout resolves `path` against GITHUB_WORKSPACE and REFUSES anything outside
      #      it (input-helper.ts:42-52: "Repository path … is not under …"). That tool cannot
      #      install anything outside the consumer tree, whatever path it is given.
      #   2. A step's `env:` cannot move GITHUB_WORKSPACE for a JavaScript action. Runner 2.337.0
      #      builds the step environment (ActionRunner.cs:240-252) and NodeScriptActionHandler then
      #      writes the runtime context over it (:42-50), with GITHUB_WORKSPACE exported from
      #      GitHubContext (:49-64). v1.7.9 shipped `env: GITHUB_WORKSPACE: ${{ runner.temp }}`
      #      with an absolute `path:` — so every consumer's delivery installed NOTHING and failed
      #      with exit 1. The runner's context is not ours to move.
      # Delivery is therefore a plain run step: fetch the pinned commit of THIS workflow's own
      # repository into $RUNNER_TEMP/pr-autofix and assert the SHA afterwards. No GITHUB_* or
      # RUNNER_* variable is set anywhere in this file — scripts/sandbox/r1-runner-faithful-
      # delivery-probe.mjs fails the build if a step ever tries again.
      # The preflight runs BEFORE any write: the target must lie outside the consumer tree, and it
      # is replaceable only with PROVEN ownership — the delivery marker and the origin URL must
      # both name this tool repository (pr-autofix#70). Anything else — a foreign checkout, a
      # marker-less install — is refused loudly, never cleared. This job runs in the CALLER's
      # repository, and the fixer below stages with `git add -A` in that repo: a tool tree in the
      # consumer root would become an unsolicited `160000` gitlink in every fix commit, and the
      # scanner would read the tool's fixtures as the consumer's own failures. Same guard as
      # before the install: no tree, no run.
      - name: Delivery target is outside the consumer tree
        if: steps.guard.outputs.skip == 'false'
        env:
          TOOL_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/pr-autofix"
          case "$target/" in
            "$GITHUB_WORKSPACE/"*) echo "::error::the tool target $target is inside the consumer tree — refusing"; exit 1 ;;
          esac
          # OWNERSHIP GUARD (pr-autofix#70): the delivery target is replaced ONLY with proven
          # ownership — the marker `.git/pr-autofix-delivery` and the origin URL must both name
          # $TOOL_REPOSITORY, the target must not be a symlink, and `.git` must be a directory.
          # A foreign checkout, a marker-less install or anything else is refused BEFORE any
          # write: never cleared, renamed or bypassed.
          if [ -e "$target" ] || [ -L "$target" ]; then
            marker="$(cat "$target/.git/pr-autofix-delivery" 2>/dev/null || true)"
            origin="$(git -C "$target" remote get-url origin 2>/dev/null || true)"
            if [ -L "$target" ] || [ ! -d "$target/.git" ] || [ "$marker" != "repo=$TOOL_REPOSITORY" ] || [ "$origin" != "https://github.com/$TOOL_REPOSITORY.git" ]; then
              echo "::error::$target exists but ownership is not proven (marker and origin must both name $TOOL_REPOSITORY) — refusing to overwrite it"
              exit 1
            fi
          fi

      - name: Materialize the pinned tool tree
        if: steps.guard.outputs.skip == 'false'
        env:
          TOOL_REPOSITORY: ${{ job.workflow_repository }}
          TOOL_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/pr-autofix"
          [ -n "${RUNNER_TEMP:-}" ] || { echo "::error::RUNNER_TEMP is empty — refusing to install the tool"; exit 1; }
          case "$target" in /*) : ;; *) echo "::error::the tool target $target is not absolute — refusing"; exit 1 ;; esac
          # Defense in depth: the SAME ownership guard as the preflight — only a proven-ours target
          # may be replaced here, and only at this point. Everything the guard refuses is left
          # exactly as it was found.
          # OWNERSHIP GUARD (pr-autofix#70): the delivery target is replaced ONLY with proven
          # ownership — the marker `.git/pr-autofix-delivery` and the origin URL must both name
          # $TOOL_REPOSITORY, the target must not be a symlink, and `.git` must be a directory.
          # A foreign checkout, a marker-less install or anything else is refused BEFORE any
          # write: never cleared, renamed or bypassed.
          if [ -e "$target" ] || [ -L "$target" ]; then
            marker="$(cat "$target/.git/pr-autofix-delivery" 2>/dev/null || true)"
            origin="$(git -C "$target" remote get-url origin 2>/dev/null || true)"
            if [ -L "$target" ] || [ ! -d "$target/.git" ] || [ "$marker" != "repo=$TOOL_REPOSITORY" ] || [ "$origin" != "https://github.com/$TOOL_REPOSITORY.git" ]; then
              echo "::error::$target exists but ownership is not proven (marker and origin must both name $TOOL_REPOSITORY) — refusing to overwrite it"
              exit 1
            fi
          fi
          rm -rf "$target"
          git init -q "$target"
          git -C "$target" remote add origin "https://github.com/$TOOL_REPOSITORY.git"
          git -C "$target" -c protocol.version=2 fetch -q --depth=1 origin "$TOOL_SHA"
          git -C "$target" checkout -q --detach FETCH_HEAD
          if [ "$(git -C "$target" rev-parse HEAD)" != "$TOOL_SHA" ]; then
            echo "::error::the delivered tree is not the pinned SHA — refusing to run it"
            exit 1
          fi
          # Ownership is now proven by construction (pinned SHA + our origin), so the marker this
          # guard reads on the next run is written last — an install that died above leaves no
          # claim to the target and is refused rather than reused.
          printf 'repo=%s\n' "$TOOL_REPOSITORY" > "$target/.git/pr-autofix-delivery"

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip == 'false'
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.guard.outputs.skip == 'false'
        run: npm ci --ignore-scripts

      # AUTOFIX_AGENT=1 (repo variable): Stages 2–3 are done by a coding agent (opencode)
      # talking to the same llm-ladder worker with the same token — no extra secret.
      - name: Install coding agent (opencode)
        if: steps.guard.outputs.skip == 'false' && vars.AUTOFIX_AGENT == '1'
        run: npm install -g opencode-ai@1.18.32 && opencode --version

      - name: Run autofix pipeline
        id: autofix
        if: steps.guard.outputs.skip == 'false'
        continue-on-error: true
        env:
          LLM_LADDER_TOKEN: ${{ secrets.llm_ladder_token }}
          GH_TOKEN: ${{ secrets.gh_token || github.token }}
          RUN_ID: ${{ inputs.run_id }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ORIGINAL_BRANCH: ${{ inputs.original_branch }}
          # Optional repo variable: another llm-ladder ladder name (default free-ladder).
          AUTOFIX_LADDER: ${{ vars.AUTOFIX_LADDER }}
          # Optional repo variables: coding-agent fix stage (issue #21).
          AUTOFIX_AGENT: ${{ vars.AUTOFIX_AGENT }}
          AUTOFIX_AGENT_TIMEOUT_MIN: ${{ vars.AUTOFIX_AGENT_TIMEOUT_MIN }}
          # Optional repo variables: diff-gate size limits (defaults 15 files / 400 lines).
          AUTOFIX_GATE_MAX_FILES: ${{ vars.AUTOFIX_GATE_MAX_FILES }}
          AUTOFIX_GATE_MAX_LINES: ${{ vars.AUTOFIX_GATE_MAX_LINES }}
          # AC-44: which tool build produced this record. Same `job` context the script is
          # fetched with — so the pin is established by the mechanism that already pins the
          # script, and no new entity appears (Z01 design §2.4).
          AUTOFIX_WORKFLOW_REF: ${{ job.workflow_ref }}
          AUTOFIX_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/pr-autofix/scripts/autofix.mjs" ]; then
            echo "::error::the pinned tool tree is not in the runner temp — refusing to run autofix"
            exit 1
          fi
          node "$RUNNER_TEMP/pr-autofix/scripts/autofix.mjs"

      - name: Report unfixed failure
        if: steps.guard.outputs.skip == 'false' && steps.autofix.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.gh_token || github.token }}
          REPO: ${{ github.repository }}
        run: |
          REASON=$(node -e "
            try {
              const s = JSON.parse(require('fs').readFileSync('ci-fixer-stats.json','utf8'));
              process.stdout.write(s.reason || s.category || 'unknown');
            } catch { process.stdout.write('unknown'); }
          " 2>/dev/null || echo "unknown")
          gh pr comment ${{ inputs.pr_number }} -R "$REPO" --body \
            "🤖 Auto-fix pipeline could not resolve this CI failure. Reason: \`${REASON}\`. Needs a human look."

      - name: Upload stats artifact
        if: steps.guard.outputs.skip == 'false' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-fixer-stats-pr${{ inputs.pr_number }}-run${{ github.run_id }}
          path: ci-fixer-stats.json
          if-no-files-found: ignore
          # A MIRROR of the receipt TTL, not its executor: GitHub expires this copy server-side
          # after 90 days. The locally testable enforcement is `retention-sweep` (R4) in
          # devbaseline-callable.yml — this number alone is configuration, not a cleanup.
          retention-days: 90
