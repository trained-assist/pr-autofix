name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contract self-test
        run: AUTOFIX_SELFTEST=1 node scripts/autofix.mjs
      - name: Contract self-test (free-first mode)
        run: AUTOFIX_SELFTEST=1 AUTOFIX_PRIMARY_MODEL=free node scripts/autofix.mjs