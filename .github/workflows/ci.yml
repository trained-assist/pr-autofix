name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contract self-test
        run: AUTOFIX_SELFTEST=1 node scripts/autofix.mjs

  # Merging into this repo requires a green staging-gate (owner rule 2026-09-16).
  # pr-autofix has no production service, so staging here is a REHEARSAL of the
  # battle path on a fixture — node --check of every script, schema validation of
  # every profile/adapter, an end-to-end `verify` (expected controlled failure),
  # and a check that every reusable workflow declares `on: workflow_call`.
  # Fidelity declaration (AC-06): this is NOT a cloud check and is never called one.
  staging-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Staging rehearsal — scenario sandbox (level S3, fully offline)
        run: node scripts/sandbox/z01-devbaseline.mjs
      - name: Reusable workflows declare workflow_call
        run: node scripts/devbaseline.mjs check-workflows --dir .github/workflows
      # The payload boundary and the gate are rehearsed here as the CONSUMER sees them, not as the
      # checkout sees them (R2): run through the same declared manifest the shipped loader uses,
      # then gate — which now blocks on needs_human and executes a declared staging.command.
      - name: Payload manifest is current (the tree the loader ships)
        run: node scripts/devbaseline.mjs payload-manifest --check
      - name: Rehearse the delivery boundary and the gate
        run: |
          node scripts/sandbox/consumer-boundary.mjs
          node scripts/sandbox/repro-r3-gate.mjs
          node scripts/sandbox/repro-r5-resolver.mjs
          node scripts/sandbox/repro-r1-remote-caller.mjs
          node scripts/sandbox/repro-r4-cleanup.mjs
      # R6: the receipt test existed but was wired into no job, so a green CI did not prove R6 —
      # the defect class this epic exists to kill, in the last place it was still alive. Its own
      # named step: the log must say WHICH defect regressed, not just that a script exited non-zero.
      - name: The receipt carries the real run (R6)
        run: node scripts/sandbox/repro-r6-receipt.mjs
      # R1: the delivery boundary is an INVARIANT of the repository, not a habit of one workflow.
      # The shipped run-step is executed in an empty consumer runner (no GITHUB_ACTION_PATH, mock
      # gh) — the exact shape that failed in #38 — and the scan proves every executed script tree
      # is delivered. Both were written but wired into no job until now.
      - name: The delivery boundary holds (R1)
        run: |
          node scripts/sandbox/r1-delivery-boundary-scan.mjs
          node scripts/sandbox/r1-shipped-run-step-probe.mjs
      # R1 (pr-autofix#54) + R2 (pr-autofix#55), iteration 4: the two blockers of the it.3
      # cross-review. Both probes read the LIVE workflow files and execute their shipped steps /
      # saved receipts, so a regression at ANY delivery point turns a named step red here instead
      # of being discovered by the next consumer that upgrades its pin.
      - name: Installing the tool leaves the consumer untouched (R1, pr-autofix#54)
        run: node scripts/sandbox/r1-root-separation-probe.mjs
      # R1 (pr-autofix#67): every probe below inverted the runner and called it fidelity. The step
      # `env:` of a JavaScript action does NOT win — NodeScriptActionHandler writes the runtime
      # context over it — so v1.7.9's `GITHUB_WORKSPACE: ${{ runner.temp }}` delivery installed
      # nothing and failed every consumer with "Repository path … is not under …". This probe runs
      # the shipped delivery under the runner's real order and asserts the tool is actually
      # INSTALLED at the pinned SHA outside the consumer. It was red on v1.7.9 (c6291a1).
      - name: Delivery installs the tool on a real runner's environment order (R1, pr-autofix#67)
        run: node scripts/sandbox/r1-runner-faithful-delivery-probe.mjs
      # R1 (pr-autofix#61): the emulation above cannot see WHAT the real actions/checkout does
      # to a consumer-owned `pr-autofix/` catalog, and that is exactly the data-loss defect of
      # the it.4 cross-review. This probe runs the REAL pinned actions/checkout@v4 dist (from
      # codeload at a fixed SHA, offline afterwards via url.insteadOf + GIT_ALLOW_PROTOCOL=file)
      # plus the shipped delivery steps against a consumer that owns pr-autofix/ three ways —
      # tracked, untracked and symlinked. A consumer that loses a byte fails here.
      - name: Delivery never destroys a consumer-owned pr-autofix/ catalog (R1, pr-autofix#61)
        run: node scripts/sandbox/r1-consumer-collision-probe.mjs
      # R1 (pr-autofix#70), iteration 7: the it.6 cross-review found that the collision preflight
      # decided ownership by ONE predicate — "`.git` exists" — so a FOREIGN Git checkout at the
      # delivery target (an orphan of another step, a reused self-hosted runner) was declared
      # "our previous clone" and `rm -rf`'d in all four delivery points, tracked and untracked data
      # included. The rule is now proven ownership (marker + origin) and refusal before any write.
      # This probe executes the shipped preflight/materialize blocks of all four points over a
      # state matrix (empty / ours / foreign / legacy / plain / symlink, each with a repeat pass),
      # and class-scans that the guard text has not drifted between the four copies. It was RED on
      # the it.6 merge 2daff54 — 16/24 scenarios, the foreign checkout destroyed at 4/4 points.
      - name: Delivery target ownership is proven, not assumed (R1, pr-autofix#70)
        run: node scripts/sandbox/r1-delivery-target-ownership-probe.mjs
      # R2 (pr-autofix#71): the hosted failed→fix evidence harness. Its LIVE phase creates a
      # disposable consumer and dispatches a real shipped workflow — never inside CI. What CI
      # gates is the harness itself: its decision logic must detect a gitlink, an extra staged
      # path, a destroyed untracked file and an incomplete bundle. A detector that cannot fail
      # proves nothing, and an unexercised harness is exactly the "written but wired into no job"
      # defect this epic exists to kill.
      - name: The hosted-evidence harness can actually fail (R2, pr-autofix#71)
        run: node scripts/sandbox/r2-hosted-harness.mjs --self-test
      - name: The receipt never wears the caller's identity (R2, pr-autofix#55)
        run: node scripts/sandbox/r2-reusable-receipt-probe.mjs
      # R3/R4: provenance entities and retention enforcement, each with its own named step.
      - name: Three provenance entities, not one (R3)
        run: node scripts/sandbox/r3-three-entities-probe.mjs
      - name: Retention is executed, not declared (R4)
        run: node scripts/sandbox/r4-retention-probe.mjs
      # The class gate: a fact written into the receipt must have a production reader, or the
      # slot must be gone. Scoped to THIS iteration's keys — the full --strict scan stays red on
      # 17 legacy slots, which is a separate issue and is not silently softened here.
      - name: Every gated slot has an owner (class gate)
        run: node scripts/sandbox/contract-slot-scan.mjs --gate-keys retention,tool_commit,gate,patch

  # R7: the repository-context job did not exist, so AC-13 — the only AC written from the
  # consumer's side — had no job. `if: always()` is the load-bearing word: the report about the
  # repository's state must still appear AFTER a failed check, which is precisely when it is
  # worth reading. It consumes the DELIVERED payload (payload-verify) rather than the checkout, so
  # it cannot be green while the thing we hand consumers is broken.
  repository-context:
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Is the payload we ship what we declared?
        run: node scripts/devbaseline.mjs payload-verify
      - name: Repository context — bound to this commit
        run: |
          node -e '
            const fs = require("fs");
            const { execFileSync } = require("child_process");
            const head = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
            fs.writeFileSync("context.manifest.json", JSON.stringify({
              source_commit: process.env.FORCED_SOURCE_COMMIT || head,
              entrypoints: ["scripts/devbaseline.mjs", "payload.manifest.json", "profiles", "contracts"],
            }, null, 2));
          '
          node scripts/devbaseline.mjs context --manifest context.manifest.json
      - name: Context against a FOREIGN commit must not read fresh
        env:
          FORCED_SOURCE_COMMIT: 0000000000000000000000000000000000000000
        run: |
          node -e '
            const fs = require("fs");
            const { execFileSync } = require("child_process");
            const head = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
            fs.writeFileSync("context.foreign.json", JSON.stringify({
              source_commit: process.env.FORCED_SOURCE_COMMIT || head,
              entrypoints: ["scripts/devbaseline.mjs", "payload.manifest.json"],
            }, null, 2));
          '
          # `set +e` around the call, not `cmd && exit 1`: under `bash -e` the `&&` form aborts on
          # the failing command before the status is read, which is the same masking shape R3 was
          # rejected for. Read the status honestly, then decide.
          set +e
          node scripts/devbaseline.mjs context --manifest context.foreign.json
          code=$?
          set -e
          if [ "$code" = "2" ]; then echo "foreign commit correctly reported as stale"; exit 0; fi
          echo "::error::a manifest from a foreign commit must be stale (exit 2), got exit $code"
          exit 1
