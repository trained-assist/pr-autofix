name: devbaseline (callable)

# Reusable workflow — one entry point for the development baseline of a repository that has no
# baseline yet. Two modes, because they answer different questions:
#
#   mode=ci            "does this repository still pass its own check?"
#   mode=staging-gate  "would this repository pass the merge gate?" (ci + the rehearsal below)
#
# Usage in your ci.yml:
#
#   devbaseline:
#     uses: trained-assist/pr-autofix/.github/workflows/devbaseline-callable.yml@v1
#     with:
#       mode: ci
#
# Note what this workflow does NOT do: it does not install anything, does not write to the
# caller repository, and does not need a token. Everything it needs is pinned by the `@ref` you
# call it with — which is also why it is safe to call from a fork.

on:
  workflow_call:
    inputs:
      mode:
        description: 'ci | staging-gate'
        required: true
        type: string
      profile:
        description: 'Force a profile (docs|node|python|mixed|minimal). Empty = derive from the tree.'
        required: false
        type: string
        default: ''
      check_timeout_minutes:
        description: 'Per-command timeout for the check step'
        required: false
        type: string
        default: '20'

jobs:
  devbaseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # R1 — the delivery boundary, now the same mechanism as ci-fix-cleanup.yml: check out the
      # TREE of the commit this workflow was called at. It replaces a hand-written list of ~20
      # files written FLAT via `$(basename "$f")` and then "proven" with `node --check` — a check
      # that parses one file and never resolves imports, so the CLI's first real run failed with
      # ERR_MODULE_NOT_FOUND while the loader reported success (R2). A full tree cannot half-work:
      # every `./lib/devbaseline/*.mjs` import comes with it, and the first new import is no longer
      # a chance to break. `payload-verify` below then proves both directions (missing AND
      # undeclared) against the manifest committed at that same SHA — and it runs the CLI FROM the
      # tree, because only running it can prove it starts.
      # R1 — THE DELIVERY BOUNDARY (pr-autofix#61, #67). Two facts about the runner decide this
      # step, and both were learned the hard way:
      #   1. actions/checkout resolves `path` against GITHUB_WORKSPACE and REFUSES anything outside
      #      it (input-helper.ts:42-52: "Repository path … is not under …"). That tool cannot
      #      install anything outside the consumer tree, whatever path it is given.
      #   2. A step's `env:` cannot move GITHUB_WORKSPACE for a JavaScript action. Runner 2.337.0
      #      builds the step environment (ActionRunner.cs:240-252) and NodeScriptActionHandler then
      #      writes the runtime context over it (:42-50), with GITHUB_WORKSPACE exported from
      #      GitHubContext (:49-64). v1.7.9 shipped `env: GITHUB_WORKSPACE: ${{ runner.temp }}`
      #      with an absolute `path:` — so every consumer's delivery installed NOTHING and failed
      #      with exit 1. The runner's context is not ours to move.
      # Delivery is therefore a plain run step: fetch the pinned commit of THIS workflow's own
      # repository into $RUNNER_TEMP/pr-autofix and assert the SHA afterwards. No GITHUB_* or
      # RUNNER_* variable is set anywhere in this file — scripts/sandbox/r1-runner-faithful-
      # delivery-probe.mjs fails the build if a step ever tries again.
      # The preflight runs BEFORE any write: the target must lie outside the consumer tree, and a
      # symlink or a directory without `.git` there is not our own tool checkout — refused loudly,
      # never cleared. The consumer tree is therefore never a materialization target: no path
      # inside it is claimed, no relocation step exists, and the doc scan, `git status` and
      # `git add -A` that follow see the consumer and only the consumer — the tool's fixtures can
      # never become the consumer's violations, and the nested git repo can never be staged as an
      # unsolicited `160000` gitlink.
      - name: Delivery target is outside the consumer tree
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/pr-autofix"
          case "$target/" in
            "$GITHUB_WORKSPACE/"*) echo "::error::the tool target $target is inside the consumer tree — refusing"; exit 1 ;;
          esac
          if [ -L "$target" ] || { [ -e "$target" ] && [ ! -d "$target/.git" ]; }; then
            echo "::error::$target exists and is not a tool checkout — refusing to overwrite it"
            exit 1
          fi

      - name: Materialize the pinned tool tree
        env:
          TOOL_REPOSITORY: ${{ job.workflow_repository }}
          TOOL_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/pr-autofix"
          # A destructive install needs an absolute target it can name: an empty RUNNER_TEMP would
          # otherwise make `$target` the root of the filesystem.
          [ -n "${RUNNER_TEMP:-}" ] || { echo "::error::RUNNER_TEMP is empty — refusing to install the tool"; exit 1; }
          case "$target" in /*) : ;; *) echo "::error::the tool target $target is not absolute — refusing"; exit 1 ;; esac
          # Defense in depth: the preflight above already refused everything that is not our own
          # tool checkout. Only what it passed may be replaced here, and only this git directory —
          # the same thing actions/checkout's prepareExistingDirectory used to clear.
          if [ -L "$target" ] || { [ -e "$target" ] && [ ! -d "$target/.git" ]; }; then
            echo "::error::$target is not a tool checkout — refusing to overwrite it"
            exit 1
          fi
          rm -rf "$target"
          git init -q "$target"
          git -C "$target" remote add origin "https://github.com/$TOOL_REPOSITORY.git"
          git -C "$target" -c protocol.version=2 fetch -q --depth=1 origin "$TOOL_SHA"
          git -C "$target" checkout -q --detach FETCH_HEAD
          if [ "$(git -C "$target" rev-parse HEAD)" != "$TOOL_SHA" ]; then
            echo "::error::the delivered tree is not the pinned SHA — refusing to run it"
            exit 1
          fi

      - name: The tree we are about to run is the tree the manifest declares
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/pr-autofix/scripts/devbaseline.mjs" ]; then
            echo "::error::the pinned tool tree is not in the runner temp — refusing to run anything"
            exit 1
          fi
          node "$RUNNER_TEMP/pr-autofix/scripts/devbaseline.mjs" payload-verify \
            --manifest "$RUNNER_TEMP/pr-autofix/payload.manifest.json" \
            --dir "$RUNNER_TEMP/pr-autofix"

      - name: Which baseline does this repository have?
        id: shape
        run: |
          node "$RUNNER_TEMP/pr-autofix/scripts/devbaseline.mjs" validate --repo . --all-profiles | tee "$RUNNER_TEMP/shape.txt"
          echo "profile_line=$(grep -m1 'profile ' "$RUNNER_TEMP/shape.txt" || echo unknown)" >> "$GITHUB_OUTPUT"

      - name: Adapter is valid
        if: inputs.profile == ''
        run: node "$RUNNER_TEMP/pr-autofix/scripts/devbaseline.mjs" validate --repo .

      - name: Documentation check
        run: node "$RUNNER_TEMP/pr-autofix/scripts/devbaseline.mjs" check-docs --dir .

      # The gate, as ONE line and ONE owner (R3). The previous version branched on exit code 2 in
      # shell and exited 0 — `needs_human` reported as a green required check, so a repository with
      # no fixer (or an exhausted fix.cap) merged while nobody was fixing it. The colour mapping now
      # lives in scripts/lib/devbaseline/gate.mjs, which also EXECUTES the adapter's
      # staging.command — declared in the schema, returned by effectiveConfig, and previously run
      # nowhere. needs_human still keeps its own outcome/reason_code in the log record.
      - name: Gate — verify, plus the staging command this repository declares
        timeout-minutes: ${{ fromJSON(inputs.check_timeout_minutes) }}
        env:
          # R2 — which TOOL build writes this receipt. The `job` context is the identity of the
          # workflow that DEFINES this job (pr-autofix), while `github.*`/GITHUB_WORKFLOW_* are
          # the CALLER's workflow — passing the caller's SHA here is exactly the provenance lie
          # of pr-autofix#55. Same pattern as autofix-callable; step-level, because `job` in
          # jobs.<id>.env is not guaranteed by GitHub.
          AUTOFIX_WORKFLOW_REF: ${{ job.workflow_ref }}
          AUTOFIX_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          args=(gate --repo . --log devbaseline-verify.json)
          [ -n "${{ inputs.profile }}" ] && args+=(--profile "${{ inputs.profile }}")
          node "$RUNNER_TEMP/pr-autofix/scripts/devbaseline.mjs" "${args[@]}"

      # R2 — the INDEPENDENT reader of the record the gate just wrote. `if: always()`: the receipt of a
      # failed gate is exactly the one worth checking. It does NOT re-judge the gate — that colour
      # is the gate step's own job and is unchanged — it opens the persisted JSON and asks whether
      # the verdict stored in it agrees with the verify_exit and staging stored next to it. Until
      # this step nothing ever opened that file (the scan showed zero production readers), so a
      # blocked merge could sit on disk as `outcome: no_change` with `gate_violations: []` and only
      # stdout would say otherwise. Fails only on a SELF-CONTRADICTORY record; a legitimately red
      # repository is not red twice for the same reason, and a missing record is left to the gate.
      - name: The record agrees with itself (receipt-check)
        if: always()
        run: |
          set +e
          if [ ! -f devbaseline-verify.json ]; then
            echo "no receipt was written — the gate step's own colour decides this job"
            exit 0
          fi
          node "$RUNNER_TEMP/pr-autofix/scripts/devbaseline.mjs" receipt-check --log devbaseline-verify.json
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error::the gate wrote a receipt that cannot be read"
            exit 1
          fi
          exit "$code"

      # R4 — retention has an EXECUTOR, not just a number. The `retention-days` below configures
      # GitHub's server-side artifact expiry (a mirror, asserted as configuration); this step is
      # the local half: every receipt this job wrote carries `retention.written_at + ttl_days`,
      # and the sweep deletes exactly the ones past their deadline. `if: always()` because the
      # records of a FAILED run are just as much subject to the TTL. Active records (no
      # written_at) and unreadable files are kept and reported — never silently deleted.
      - name: Retention is executed, not declared (retention-sweep)
        if: always()
        run: |
          set -euo pipefail
          store="$RUNNER_TEMP/receipts"
          mkdir -p "$store"
          # Collect every receipt this job produced into the store the sweeper owns.
          for f in devbaseline-verify.json; do
            [ -f "$f" ] && cp "$f" "$store/" || true
          done
          node "$RUNNER_TEMP/pr-autofix/scripts/devbaseline.mjs" retention-sweep --dir "$store"

      - name: Upload the verify record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devbaseline-verify-${{ github.run_id }}
          path: devbaseline-verify.json
          if-no-files-found: ignore
          # A MIRROR of the local TTL, not its executor: GitHub expires this copy server-side
          # after 90 days. The deletion that is actually testable is retention-sweep above (R4).
          retention-days: 90

      - name: Inventory row for this repository
        if: inputs.mode == 'staging-gate'
        env:
          # R2 — the inventory row carries `profile_ref` from toolVersion(); without the tool's
          # own pin it must degrade to `unpinned:local`, never to the caller's workflow ref.
          AUTOFIX_WORKFLOW_REF: ${{ job.workflow_ref }}
          AUTOFIX_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          node "$RUNNER_TEMP/pr-autofix/scripts/devbaseline.mjs" inventory \
            --out devbaseline-inventory \
            --repos <(printf '[{"repo":"%s","type_hint":null,"ci_required":null,"path":"."}]\n' "$GITHUB_REPOSITORY")
          cat devbaseline-inventory/repo-coverage.md >> "$GITHUB_STEP_SUMMARY"
          echo '--- construction tasks (dry run, nothing filed) ---' >> "$GITHUB_STEP_SUMMARY"
          cat devbaseline-inventory/construction-tasks.md >> "$GITHUB_STEP_SUMMARY"