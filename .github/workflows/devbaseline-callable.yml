name: devbaseline (callable)

# Reusable workflow — one entry point for the development baseline of a repository that has no
# baseline yet. Two modes, because they answer different questions:
#
#   mode=ci            "does this repository still pass its own check?"
#   mode=staging-gate  "would this repository pass the merge gate?" (ci + the rehearsal below)
#
# Usage in your ci.yml:
#
#   devbaseline:
#     uses: trained-assist/pr-autofix/.github/workflows/devbaseline-callable.yml@v1
#     with:
#       mode: ci
#
# Note what this workflow does NOT do: it does not install anything, does not write to the
# caller repository, and does not need a token. Everything it needs is pinned by the `@ref` you
# call it with — which is also why it is safe to call from a fork.

on:
  workflow_call:
    inputs:
      mode:
        description: 'ci | staging-gate'
        required: true
        type: string
      profile:
        description: 'Force a profile (docs|node|python|mixed|minimal). Empty = derive from the tree.'
        required: false
        type: string
        default: ''
      check_timeout_minutes:
        description: 'Per-command timeout for the check step'
        required: false
        type: string
        default: '20'

jobs:
  devbaseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # R1 — the delivery boundary, now the same mechanism as ci-fix-cleanup.yml: check out the
      # TREE of the commit this workflow was called at. It replaces a hand-written list of ~20
      # files written FLAT via `$(basename "$f")` and then "proven" with `node --check` — a check
      # that parses one file and never resolves imports, so the CLI's first real run failed with
      # ERR_MODULE_NOT_FOUND while the loader reported success (R2). A full tree cannot half-work:
      # every `./lib/devbaseline/*.mjs` import comes with it, and the first new import is no longer
      # a chance to break. `payload-verify` below then proves both directions (missing AND
      # undeclared) against the manifest committed at that same SHA — and it runs the CLI FROM the
      # tree, because only running it can prove it starts.
      - name: Materialize the pinned tool tree
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: pr-autofix
          persist-credentials: false

      - name: The tree we are about to run is the tree the manifest declares
        run: |
          set -euo pipefail
          if [ ! -f pr-autofix/scripts/devbaseline.mjs ]; then
            echo "::error::the pinned tool tree is not in the workspace — refusing to run anything"
            exit 1
          fi
          node pr-autofix/scripts/devbaseline.mjs payload-verify \
            --manifest pr-autofix/payload.manifest.json \
            --dir pr-autofix

      - name: Which baseline does this repository have?
        id: shape
        run: |
          node pr-autofix/scripts/devbaseline.mjs validate --repo . --all-profiles | tee "$RUNNER_TEMP/shape.txt"
          echo "profile_line=$(grep -m1 'profile ' "$RUNNER_TEMP/shape.txt" || echo unknown)" >> "$GITHUB_OUTPUT"

      - name: Adapter is valid
        if: inputs.profile == ''
        run: node pr-autofix/scripts/devbaseline.mjs validate --repo .

      - name: Documentation check
        run: node pr-autofix/scripts/devbaseline.mjs check-docs --dir .

      # The gate, as ONE line and ONE owner (R3). The previous version branched on exit code 2 in
      # shell and exited 0 — `needs_human` reported as a green required check, so a repository with
      # no fixer (or an exhausted fix.cap) merged while nobody was fixing it. The colour mapping now
      # lives in scripts/lib/devbaseline/gate.mjs, which also EXECUTES the adapter's
      # staging.command — declared in the schema, returned by effectiveConfig, and previously run
      # nowhere. needs_human still keeps its own outcome/reason_code in the log record.
      - name: Gate — verify, plus the staging command this repository declares
        timeout-minutes: ${{ fromJSON(inputs.check_timeout_minutes) }}
        run: |
          args=(gate --repo . --log devbaseline-verify.json)
          [ -n "${{ inputs.profile }}" ] && args+=(--profile "${{ inputs.profile }}")
          node pr-autofix/scripts/devbaseline.mjs "${args[@]}"

      - name: Upload the verify record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devbaseline-verify-${{ github.run_id }}
          path: devbaseline-verify.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Inventory row for this repository
        if: inputs.mode == 'staging-gate'
        run: |
          node pr-autofix/scripts/devbaseline.mjs inventory \
            --out devbaseline-inventory \
            --repos <(printf '[{"repo":"%s","type_hint":null,"ci_required":null,"path":"."}]\n' "$GITHUB_REPOSITORY")
          cat devbaseline-inventory/repo-coverage.md >> "$GITHUB_STEP_SUMMARY"
          echo '--- construction tasks (dry run, nothing filed) ---' >> "$GITHUB_STEP_SUMMARY"
          cat devbaseline-inventory/construction-tasks.md >> "$GITHUB_STEP_SUMMARY"