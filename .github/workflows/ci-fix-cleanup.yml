name: CI fix cleanup (callable)

# Reusable workflow — removes the `pr-autofix-fix/*` branches a previous autofix run created.
#
# WHY THIS FILE EXISTS (Z01, R26): software-engineering-playbooks' installer writes
# `uses: trained-assist/pr-autofix/.github/workflows/ci-fix-cleanup.yml@<ref>`. Until now the
# only file of that name was `templates/ci-fix-cleanup.yml`, which has no `workflow_call` — so
# every repository installed with `features.cleanup = true` got a workflow that cannot compose,
# and the consumer's CI failed at the `uses:` line. The template stays for hand-copying; this is
# the callable the installer is supposed to point at.
#
# Usage in your ci.yml:
#
#   cleanup:
#     if: always() && github.event_name == 'pull_request' && !github.event.pull_request.draft
#     needs: [autofix]
#     permissions:
#       contents: write
#       pull-requests: write
#     uses: trained-assist/pr-autofix/.github/workflows/ci-fix-cleanup.yml@v1
#     with:
#       dry_run: true
#       keep_branches: '[]'
#     secrets:
#       gh_token: ${{ secrets.AUTOFIX_PAT || github.token }}

on:
  workflow_call:
    inputs:
      pr_number:
        # CHANGED (R4): an empty or 0 scope used to mean "every pr-autofix-fix/* branch", which is
        # how a cleanup for PR 11 deleted PR 22's branch. An unusable scope now refuses EVERY
        # branch and fails the job with an explicit error: a missing scope must never widen to all.
        # A branch is deleted only when the prefix, its own PR number and this scope agree.
        description: 'PR whose OWN fix branches are cleaned up. Required: empty/0 refuses everything.'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Print the plan (delete / keep / refused) and delete nothing.'
        required: false
        type: boolean
        default: true
      keep_branches:
        description: 'JSON array of branch names to KEEP (e.g. the branch of an open fix PR)'
        required: false
        type: string
        default: '[]'
    secrets:
      gh_token:
        description: 'Token with contents:write. Falls back to the caller token when omitted.'
        required: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # R1 — THE DELIVERY BOUNDARY. A reusable workflow runs in the CALLER's repository, so this
      # job used to reach for `$GITHUB_ACTION_PATH` (a variable only a COMPOSITE action sets) and
      # never brought the tool with it: the step died at `line 6: GITHUB_ACTION_PATH: unbound
      # variable` before any GitHub call, in every consumer. One mechanism now delivers the tool
      # for all three reusable workflows: check out the pinned tree of THIS workflow's own commit.
      # It is a full tree, not a file list, so every relative import comes with it — the first
      # import is no longer a chance to break. `persist-credentials: false` leaves no token in the
      # clone. The invariant is enforced by scripts/sandbox/r1-delivery-boundary-scan.mjs, and the
      # step that runs is rehearsed by scripts/sandbox/r1-shipped-run-step-probe.mjs in an EMPTY
      # consumer runner — not by grepping this file for a script name.
      - name: Materialize the pinned tool tree
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: pr-autofix
          persist-credentials: false

      # R1 (pr-autofix#54) — `path: pr-autofix` can only materialize inside GITHUB_WORKSPACE, so
      # the tree is moved out of the consumer root immediately: this job runs in the CALLER's
      # repository, and installing a tool must leave that repository's scan, status and diff
      # exactly as it found them (pr-autofix#54). Enforced class-wide by
      # scripts/sandbox/r1-root-separation-probe.mjs.
      - name: Relocate the tool tree out of the consumer root
        run: |
          set -euo pipefail
          if [ ! -d "$GITHUB_WORKSPACE/pr-autofix" ]; then
            echo "::error::the pinned tool tree was not materialized — refusing to run anything"
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/pr-autofix"
          mv "$GITHUB_WORKSPACE/pr-autofix" "$RUNNER_TEMP/pr-autofix"

      # Branch deletion is destructive and irreversible, so the OWNERSHIP decision lives in
      # scripts/lib/devbaseline/cleanup.mjs as a pure predicate (false by default) and this step is
      # only the executor. R4: the previous loop filtered by the `pr-autofix-fix/` prefix alone, so
      # pr_number=11 deleted PR 22's branch — the input was documented as the scope of action and
      # used only in the summary line. It also read the branch list with `2>/dev/null || true`
      # under `set -uo pipefail`, so an unavailable API produced an empty list, "nothing to do",
      # exit 0 — "no such branch" and "I could not ask" were the same event.
      - name: Delete this PR's own pr-autofix-fix/* branches
        env:
          GH_TOKEN: ${{ secrets.gh_token || github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          KEEP_BRANCHES: ${{ inputs.keep_branches }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::no gh_token provided — refusing to guess a branch list; nothing deleted"
            exit 1
          fi
          if [ ! -f "$RUNNER_TEMP/pr-autofix/scripts/cleanup-branches.mjs" ]; then
            echo "::error::the pinned tool tree is not in the runner temp — refusing to run anything"
            exit 1
          fi
          node "$RUNNER_TEMP/pr-autofix/scripts/cleanup-branches.mjs" \
            --repo "${GITHUB_REPOSITORY}" \
            --pr "${PR_NUMBER:-}" \
            --keep "${KEEP_BRANCHES:-[]}" \
            ${{ inputs.dry_run && '--dry-run' || '--no-dry-run' }}
