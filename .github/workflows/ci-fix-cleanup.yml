name: CI fix cleanup (callable)

# Reusable workflow — removes the `pr-autofix-fix/*` branches a previous autofix run created.
#
# WHY THIS FILE EXISTS (Z01, R26): software-engineering-playbooks' installer writes
# `uses: trained-assist/pr-autofix/.github/workflows/ci-fix-cleanup.yml@<ref>`. Until now the
# only file of that name was `templates/ci-fix-cleanup.yml`, which has no `workflow_call` — so
# every repository installed with `features.cleanup = true` got a workflow that cannot compose,
# and the consumer's CI failed at the `uses:` line. The template stays for hand-copying; this is
# the callable the installer is supposed to point at.
#
# Usage in your ci.yml:
#
#   cleanup:
#     if: always() && github.event_name == 'pull_request' && !github.event.pull_request.draft
#     needs: [autofix]
#     permissions:
#       contents: write
#       pull-requests: write
#     uses: trained-assist/pr-autofix/.github/workflows/ci-fix-cleanup.yml@v1
#     with:
#       dry_run: true
#       keep_branches: '[]'
#     secrets:
#       gh_token: ${{ secrets.AUTOFIX_PAT || github.token }}

on:
  workflow_call:
    inputs:
      pr_number:
        # CHANGED (R4): an empty or 0 scope used to mean "every pr-autofix-fix/* branch", which is
        # how a cleanup for PR 11 deleted PR 22's branch. An unusable scope now refuses EVERY
        # branch and fails the job with an explicit error: a missing scope must never widen to all.
        # A branch is deleted only when the prefix, its own PR number and this scope agree.
        description: 'PR whose OWN fix branches are cleaned up. Required: empty/0 refuses everything.'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Print the plan (delete / keep / refused) and delete nothing.'
        required: false
        type: boolean
        default: true
      keep_branches:
        description: 'JSON array of branch names to KEEP (e.g. the branch of an open fix PR)'
        required: false
        type: string
        default: '[]'
    secrets:
      gh_token:
        description: 'Token with contents:write. Falls back to the caller token when omitted.'
        required: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # R1 — THE DELIVERY BOUNDARY. A reusable workflow runs in the CALLER's repository, so this
      # job used to reach for `$GITHUB_ACTION_PATH` (a variable only a COMPOSITE action sets) and
      # never brought the tool with it: the step died at `line 6: GITHUB_ACTION_PATH: unbound
      # variable` before any GitHub call, in every consumer. One mechanism now delivers the tool
      # for all three reusable workflows: check out the pinned tree of THIS workflow's own commit.
      # It is a full tree, not a file list, so every relative import comes with it — the first
      # import is no longer a chance to break. `persist-credentials: false` leaves no token in the
      # clone. The invariant is enforced by scripts/sandbox/r1-delivery-boundary-scan.mjs, and the
      # step that runs is rehearsed by scripts/sandbox/r1-shipped-run-step-probe.mjs in an EMPTY
      # consumer runner — not by grepping this file for a script name.
      # R1 — THE DELIVERY BOUNDARY (pr-autofix#61, #67). Two facts about the runner decide this
      # step, and both were learned the hard way:
      #   1. actions/checkout resolves `path` against GITHUB_WORKSPACE and REFUSES anything outside
      #      it (input-helper.ts:42-52: "Repository path … is not under …"). That tool cannot
      #      install anything outside the consumer tree, whatever path it is given.
      #   2. A step's `env:` cannot move GITHUB_WORKSPACE for a JavaScript action. Runner 2.337.0
      #      builds the step environment (ActionRunner.cs:240-252) and NodeScriptActionHandler then
      #      writes the runtime context over it (:42-50), with GITHUB_WORKSPACE exported from
      #      GitHubContext (:49-64). v1.7.9 shipped `env: GITHUB_WORKSPACE: ${{ runner.temp }}`
      #      with an absolute `path:` — so every consumer's delivery installed NOTHING and failed
      #      with exit 1. The runner's context is not ours to move.
      # Delivery is therefore a plain run step: fetch the pinned commit of THIS workflow's own
      # repository into $RUNNER_TEMP/pr-autofix and assert the SHA afterwards. No GITHUB_* or
      # RUNNER_* variable is set anywhere in this file — scripts/sandbox/r1-runner-faithful-
      # delivery-probe.mjs fails the build if a step ever tries again.
      # This job runs in the CALLER's repository, and installing a tool must leave that
      # repository's scan, status and diff exactly as it found them (pr-autofix#61). The preflight
      # runs BEFORE any write: the target must lie outside the consumer tree, and it is
      # replaceable only with PROVEN ownership — the delivery marker and the origin URL must both
      # name this tool repository (pr-autofix#70). Anything else — a foreign checkout, a
      # marker-less install — is refused loudly, never cleared. So the consumer tree is never a
      # materialization target and no relocation step exists to collide with its content.
      - name: Delivery target is outside the consumer tree
        env:
          TOOL_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/pr-autofix"
          case "$target/" in
            "$GITHUB_WORKSPACE/"*) echo "::error::the tool target $target is inside the consumer tree — refusing"; exit 1 ;;
          esac
          # OWNERSHIP GUARD (pr-autofix#70): the delivery target is replaced ONLY with proven
          # ownership — the marker `.git/pr-autofix-delivery` and the origin URL must both name
          # $TOOL_REPOSITORY, the target must not be a symlink, and `.git` must be a directory.
          # A foreign checkout, a marker-less install or anything else is refused BEFORE any
          # write: never cleared, renamed or bypassed.
          if [ -e "$target" ] || [ -L "$target" ]; then
            marker="$(cat "$target/.git/pr-autofix-delivery" 2>/dev/null || true)"
            origin="$(git -C "$target" config --get remote.origin.url 2>/dev/null || true)"
            if [ -L "$target" ] || [ ! -d "$target/.git" ] || [ "$marker" != "repo=$TOOL_REPOSITORY" ] || [ "$origin" != "https://github.com/$TOOL_REPOSITORY.git" ]; then
              echo "::error::$target exists but ownership is not proven (marker and origin must both name $TOOL_REPOSITORY) — refusing to overwrite it"
              exit 1
            fi
          fi

      - name: Materialize the pinned tool tree
        env:
          TOOL_REPOSITORY: ${{ job.workflow_repository }}
          TOOL_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/pr-autofix"
          [ -n "${RUNNER_TEMP:-}" ] || { echo "::error::RUNNER_TEMP is empty — refusing to install the tool"; exit 1; }
          case "$target" in /*) : ;; *) echo "::error::the tool target $target is not absolute — refusing"; exit 1 ;; esac
          # Defense in depth: the SAME ownership guard as the preflight — only a proven-ours target
          # may be replaced here, and only at this point. Everything the guard refuses is left
          # exactly as it was found.
          # OWNERSHIP GUARD (pr-autofix#70): the delivery target is replaced ONLY with proven
          # ownership — the marker `.git/pr-autofix-delivery` and the origin URL must both name
          # $TOOL_REPOSITORY, the target must not be a symlink, and `.git` must be a directory.
          # A foreign checkout, a marker-less install or anything else is refused BEFORE any
          # write: never cleared, renamed or bypassed.
          if [ -e "$target" ] || [ -L "$target" ]; then
            marker="$(cat "$target/.git/pr-autofix-delivery" 2>/dev/null || true)"
            origin="$(git -C "$target" config --get remote.origin.url 2>/dev/null || true)"
            if [ -L "$target" ] || [ ! -d "$target/.git" ] || [ "$marker" != "repo=$TOOL_REPOSITORY" ] || [ "$origin" != "https://github.com/$TOOL_REPOSITORY.git" ]; then
              echo "::error::$target exists but ownership is not proven (marker and origin must both name $TOOL_REPOSITORY) — refusing to overwrite it"
              exit 1
            fi
          fi
          rm -rf "$target"
          git init -q "$target"
          git -C "$target" remote add origin "https://github.com/$TOOL_REPOSITORY.git"
          git -C "$target" -c protocol.version=2 fetch -q --depth=1 origin "$TOOL_SHA"
          git -C "$target" checkout -q --detach FETCH_HEAD
          if [ "$(git -C "$target" rev-parse HEAD)" != "$TOOL_SHA" ]; then
            echo "::error::the delivered tree is not the pinned SHA — refusing to run it"
            exit 1
          fi
          # Ownership is now proven by construction (pinned SHA + our origin), so the marker this
          # guard reads on the next run is written last — an install that died above leaves no
          # claim to the target and is refused rather than reused.
          printf 'repo=%s\n' "$TOOL_REPOSITORY" > "$target/.git/pr-autofix-delivery"

      # Branch deletion is destructive and irreversible, so the OWNERSHIP decision lives in
      # scripts/lib/devbaseline/cleanup.mjs as a pure predicate (false by default) and this step is
      # only the executor. R4: the previous loop filtered by the `pr-autofix-fix/` prefix alone, so
      # pr_number=11 deleted PR 22's branch — the input was documented as the scope of action and
      # used only in the summary line. It also read the branch list with `2>/dev/null || true`
      # under `set -uo pipefail`, so an unavailable API produced an empty list, "nothing to do",
      # exit 0 — "no such branch" and "I could not ask" were the same event.
      - name: Delete this PR's own pr-autofix-fix/* branches
        env:
          GH_TOKEN: ${{ secrets.gh_token || github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          KEEP_BRANCHES: ${{ inputs.keep_branches }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::no gh_token provided — refusing to guess a branch list; nothing deleted"
            exit 1
          fi
          if [ ! -f "$RUNNER_TEMP/pr-autofix/scripts/cleanup-branches.mjs" ]; then
            echo "::error::the pinned tool tree is not in the runner temp — refusing to run anything"
            exit 1
          fi
          node "$RUNNER_TEMP/pr-autofix/scripts/cleanup-branches.mjs" \
            --repo "${GITHUB_REPOSITORY}" \
            --pr "${PR_NUMBER:-}" \
            --keep "${KEEP_BRANCHES:-[]}" \
            ${{ inputs.dry_run && '--dry-run' || '--no-dry-run' }}
