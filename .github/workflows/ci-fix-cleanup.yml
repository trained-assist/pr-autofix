name: CI fix cleanup (callable)

# Reusable workflow — removes the `pr-autofix-fix/*` branches a previous autofix run created.
#
# WHY THIS FILE EXISTS (Z01, R26): software-engineering-playbooks' installer writes
# `uses: trained-assist/pr-autofix/.github/workflows/ci-fix-cleanup.yml@<ref>`. Until now the
# only file of that name was `templates/ci-fix-cleanup.yml`, which has no `workflow_call` — so
# every repository installed with `features.cleanup = true` got a workflow that cannot compose,
# and the consumer's CI failed at the `uses:` line. The template stays for hand-copying; this is
# the callable the installer is supposed to point at.
#
# Usage in your ci.yml:
#
#   cleanup:
#     if: always() && github.event_name == 'pull_request' && !github.event.pull_request.draft
#     needs: [autofix]
#     permissions:
#       contents: write
#       pull-requests: write
#     uses: trained-assist/pr-autofix/.github/workflows/ci-fix-cleanup.yml@v1
#     with:
#       keep_branches: '[]'
#     secrets:
#       gh_token: ${{ secrets.AUTOFIX_PAT || github.token }}

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'PR whose fix branches are cleaned up (0 = every pr-autofix-fix/* branch)'
        required: false
        type: string
        default: ''
      keep_branches:
        description: 'JSON array of branch names to KEEP (e.g. the branch of an open fix PR)'
        required: false
        type: string
        default: '[]'
    secrets:
      gh_token:
        description: 'Token with contents:write. Falls back to the caller token when omitted.'
        required: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Delete pr-autofix-fix/* branches
        env:
          GH_TOKEN: ${{ secrets.gh_token || github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          KEEP_BRANCHES: ${{ inputs.keep_branches }}
        run: |
          set -uo pipefail

          # Branch deletion is destructive and irreversible on GitHub, so the pattern is scoped
          # to this tool's own prefix and every candidate is printed before anything is deleted.
          PATTERN='pr-autofix-fix/'
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::no gh_token provided — nothing to clean up"
            exit 0
          fi

          echo "keep list: ${KEEP_BRANCHES:-[]}"
          KEEP_OK=$(node -e '
            const raw = process.argv[1] || "[]";
            try {
              const v = JSON.parse(raw);
              if (!Array.isArray(v)) throw new Error("keep_branches must be a JSON array");
              process.stdout.write("ok");
            } catch (e) { process.stdout.write(`bad:${e.message}`); }
          ' "${KEEP_BRANCHES:-[]}")
          case "$KEEP_OK" in
            ok) ;;
            *) echo "::error::keep_branches is not valid JSON ($KEEP_OK) — refusing to delete anything"; exit 1 ;;
          esac

          REPO="${GITHUB_REPOSITORY}"
          mapfile -t BRANCHES < <(gh api "repos/$REPO/git/matching-refs/heads/$PATTERN" --jq '.[].ref' 2>/dev/null \
            | sed 's|^refs/heads/||' || true)

          if [ "${#BRANCHES[@]}" -eq 0 ]; then
            echo "no branches match ${PATTERN} — nothing to do"
            exit 0
          fi

          DELETED=0; KEPT=0
          for b in "${BRANCHES[@]}"; do
            [ -n "$b" ] || continue
            if node -e 'const k=JSON.parse(process.argv[1]);process.exit(k.includes(process.argv[2])?0:1)' "${KEEP_BRANCHES:-[]}" "$b"; then
              echo "keep    $b (listed in keep_branches)"; KEPT=$((KEPT+1)); continue
            fi
            echo "delete  $b"
            if gh api -X DELETE "repos/$REPO/git/refs/heads/$b" >/dev/null 2>&1; then
              DELETED=$((DELETED+1))
            else
              echo "::warning::could not delete $b (may already be gone)"
            fi
          done
          echo "cleanup summary: deleted=$DELETED kept=$KEPT scanned=${#BRANCHES[@]} pr=${PR_NUMBER:-n/a}"