name: Batch fix PRs (manual)

# Runs the autofix pipeline on one or more existing PRs.
# Copy this file into your .github/workflows/ directory.
#
# Usage:
#   gh workflow run batch-fix-prs.yml --field pr_numbers="42,41,39"
#
# PRs are processed SEQUENTIALLY (max-parallel: 1) — intentional:
# parallel fix PRs would immediately conflict with each other.

on:
  workflow_dispatch:
    inputs:
      pr_numbers:
        description: 'Comma-separated PR numbers (e.g. 42,41,39)'
        required: true
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  matrix-setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - name: Parse PR numbers into matrix
        id: parse
        run: |
          INPUT="${{ github.event.inputs.pr_numbers }}"
          MATRIX=$(echo "$INPUT" | tr ',' '\n' | sed 's/[^0-9]//g' | grep -v '^$' | jq -R . | jq -sc '{pr: .}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  fix:
    needs: matrix-setup
    strategy:
      matrix: ${{ fromJson(needs.matrix-setup.outputs.matrix) }}
      max-parallel: 1
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Get PR branch
        id: pr-info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON=$(gh pr view ${{ matrix.pr }} -R "${{ github.repository }}" --json headRefName,state)
          BRANCH=$(echo "$PR_JSON" | jq -r '.headRefName')
          STATE=$(echo "$PR_JSON" | jq -r '.state')
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          if [ "$STATE" != "OPEN" ]; then
            echo "PR is $STATE — skipping"
            exit 1
          fi

      - name: Close stale fix/ci-* PRs for this branch
        env:
          GH_TOKEN: ${{ secrets.AUTOFIX_PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.pr-info.outputs.branch }}"
          SAFE_BRANCH=$(echo "$BRANCH" | tr '/' '-' | sed 's/[^a-zA-Z0-9-]/-/g' | cut -c1-40)
          EXISTING=$(gh pr list -R "${{ github.repository }}" \
            --json number,headRefName --state open \
            | jq -r ".[] | select(.headRefName | startswith(\"fix/ci-${SAFE_BRANCH}-\")) | .number" \
            | head -1)
          if [ -n "$EXISTING" ]; then
            gh pr close "$EXISTING" -R "${{ github.repository }}" \
              --comment "♻️ Superseded — batch re-run will create a fresh fix PR."
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr-info.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.AUTOFIX_PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      # Pinned by the COMMIT this workflow ran from, never by `main` (R2/§5.1). The template
      # violated exactly the invariant autofix-callable.yml enforces: a caller invoking it by a
      # moving branch would execute whatever main happened to hold. The refusal to fall back is
      # deliberate — a silent fallback to `main` is how a gate stops being a gate.
      #
      # R1: it downloaded ONE file and "proved" it with `node --check`, which never resolves
      # imports — the day autofix.mjs gained its first relative import this template would run a
      # script that cannot start behind a green check. It also downloaded to $RUNNER_TEMP and then
      # ran `/tmp/autofix.mjs`, two different paths on a GitHub runner. Same mechanism as the
      # reusable workflows now: the whole pinned tree, so every import comes with it.
      # R1 — THE DELIVERY BOUNDARY (pr-autofix#61, #67). Two facts about the runner decide this
      # step, and both were learned the hard way:
      #   1. actions/checkout resolves `path` against GITHUB_WORKSPACE and REFUSES anything outside
      #      it (input-helper.ts:42-52: "Repository path … is not under …"). That tool cannot
      #      install anything outside the consumer tree, whatever path it is given.
      #   2. A step's `env:` cannot move GITHUB_WORKSPACE for a JavaScript action. Runner 2.337.0
      #      builds the step environment (ActionRunner.cs:240-252) and NodeScriptActionHandler then
      #      writes the runtime context over it (:42-50), with GITHUB_WORKSPACE exported from
      #      GitHubContext (:49-64). v1.7.9 shipped `env: GITHUB_WORKSPACE: ${{ runner.temp }}`
      #      with an absolute `path:` — so every consumer's delivery installed NOTHING and failed
      #      with exit 1. The runner's context is not ours to move.
      # Delivery is therefore a plain run step: fetch the pinned commit into $RUNNER_TEMP/pr-autofix
      # and assert the SHA afterwards. No GITHUB_* or RUNNER_* variable is set anywhere in this
      # file — scripts/sandbox/r1-runner-faithful-delivery-probe.mjs fails the build if a step ever
      # tries again. The preflight runs BEFORE any write: the target must lie outside the consumer
      # tree, and it is replaceable only with PROVEN ownership — the delivery marker and the
      # origin URL must both name this tool repository (pr-autofix#70). Anything else — a foreign
      # checkout, a marker-less install — is refused loudly, never cleared. Autofix stages with
      # `git add -A` in the consumer repo, so a tool tree in its root would become an unsolicited
      # gitlink in the fix commit.
      - name: Delivery target is outside the consumer tree
        env:
          TOOL_REPOSITORY: trained-assist/pr-autofix
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/pr-autofix"
          case "$target/" in
            "$GITHUB_WORKSPACE/"*) echo "::error::the tool target $target is inside the consumer tree — refusing"; exit 1 ;;
          esac
          # OWNERSHIP GUARD (pr-autofix#70): the delivery target is replaced ONLY with proven
          # ownership — the marker `.git/pr-autofix-delivery` and the origin URL must both name
          # $TOOL_REPOSITORY, the target must not be a symlink, and `.git` must be a directory.
          # A foreign checkout, a marker-less install or anything else is refused BEFORE any
          # write: never cleared, renamed or bypassed.
          if [ -e "$target" ] || [ -L "$target" ]; then
            marker="$(cat "$target/.git/pr-autofix-delivery" 2>/dev/null || true)"
            origin="$(git -C "$target" remote get-url origin 2>/dev/null || true)"
            if [ -L "$target" ] || [ ! -d "$target/.git" ] || [ "$marker" != "repo=$TOOL_REPOSITORY" ] || [ "$origin" != "https://github.com/$TOOL_REPOSITORY.git" ]; then
              echo "::error::$target exists but ownership is not proven (marker and origin must both name $TOOL_REPOSITORY) — refusing to overwrite it"
              exit 1
            fi
          fi

      - name: Materialize the pinned tool tree
        env:
          TOOL_REPOSITORY: trained-assist/pr-autofix
          TOOL_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/pr-autofix"
          [ -n "${RUNNER_TEMP:-}" ] || { echo "::error::RUNNER_TEMP is empty — refusing to install the tool"; exit 1; }
          case "$target" in /*) : ;; *) echo "::error::the tool target $target is not absolute — refusing"; exit 1 ;; esac
          # Defense in depth: the SAME ownership guard as the preflight — only a proven-ours target
          # may be replaced here, and only at this point. Everything the guard refuses is left
          # exactly as it was found.
          # OWNERSHIP GUARD (pr-autofix#70): the delivery target is replaced ONLY with proven
          # ownership — the marker `.git/pr-autofix-delivery` and the origin URL must both name
          # $TOOL_REPOSITORY, the target must not be a symlink, and `.git` must be a directory.
          # A foreign checkout, a marker-less install or anything else is refused BEFORE any
          # write: never cleared, renamed or bypassed.
          if [ -e "$target" ] || [ -L "$target" ]; then
            marker="$(cat "$target/.git/pr-autofix-delivery" 2>/dev/null || true)"
            origin="$(git -C "$target" remote get-url origin 2>/dev/null || true)"
            if [ -L "$target" ] || [ ! -d "$target/.git" ] || [ "$marker" != "repo=$TOOL_REPOSITORY" ] || [ "$origin" != "https://github.com/$TOOL_REPOSITORY.git" ]; then
              echo "::error::$target exists but ownership is not proven (marker and origin must both name $TOOL_REPOSITORY) — refusing to overwrite it"
              exit 1
            fi
          fi
          rm -rf "$target"
          git init -q "$target"
          git -C "$target" remote add origin "https://github.com/$TOOL_REPOSITORY.git"
          git -C "$target" -c protocol.version=2 fetch -q --depth=1 origin "$TOOL_SHA"
          git -C "$target" checkout -q --detach FETCH_HEAD
          if [ "$(git -C "$target" rev-parse HEAD)" != "$TOOL_SHA" ]; then
            echo "::error::the delivered tree is not the pinned SHA — refusing to run it"
            exit 1
          fi
          # Ownership is now proven by construction (pinned SHA + our origin), so the marker this
          # guard reads on the next run is written last — an install that died above leaves no
          # claim to the target and is refused rather than reused.
          printf 'repo=%s\n' "$TOOL_REPOSITORY" > "$target/.git/pr-autofix-delivery"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run autofix (batch mode)
        continue-on-error: true
        env:
          LLM_LADDER_TOKEN: ${{ secrets.LLM_LADDER_TOKEN }}
          GH_TOKEN: ${{ secrets.AUTOFIX_PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          RUN_ID: '0'
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.pr }}
          ORIGINAL_BRANCH: ${{ steps.pr-info.outputs.branch }}
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/pr-autofix/scripts/autofix.mjs" ]; then
            echo "::error::the pinned tool tree is not in the runner temp — refusing to run autofix"
            exit 1
          fi
          node "$RUNNER_TEMP/pr-autofix/scripts/autofix.mjs"

      - name: Upload stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-fix-stats-pr${{ matrix.pr }}-run${{ github.run_id }}
          path: ci-fixer-stats.json
          if-no-files-found: ignore
          retention-days: 90
