name: Batch fix PRs (manual)

# Runs the autofix pipeline on one or more existing PRs.
# Copy this file into your .github/workflows/ directory.
#
# Usage:
#   gh workflow run batch-fix-prs.yml --field pr_numbers="42,41,39"
#
# PRs are processed SEQUENTIALLY (max-parallel: 1) — intentional:
# parallel fix PRs would immediately conflict with each other.

on:
  workflow_dispatch:
    inputs:
      pr_numbers:
        description: 'Comma-separated PR numbers (e.g. 42,41,39)'
        required: true
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  matrix-setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - name: Parse PR numbers into matrix
        id: parse
        run: |
          INPUT="${{ github.event.inputs.pr_numbers }}"
          MATRIX=$(echo "$INPUT" | tr ',' '\n' | sed 's/[^0-9]//g' | grep -v '^$' | jq -R . | jq -sc '{pr: .}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  fix:
    needs: matrix-setup
    strategy:
      matrix: ${{ fromJson(needs.matrix-setup.outputs.matrix) }}
      max-parallel: 1
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Get PR branch
        id: pr-info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON=$(gh pr view ${{ matrix.pr }} -R "${{ github.repository }}" --json headRefName,state)
          BRANCH=$(echo "$PR_JSON" | jq -r '.headRefName')
          STATE=$(echo "$PR_JSON" | jq -r '.state')
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          if [ "$STATE" != "OPEN" ]; then
            echo "PR is $STATE — skipping"
            exit 1
          fi

      - name: Close stale fix/ci-* PRs for this branch
        env:
          GH_TOKEN: ${{ secrets.AUTOFIX_PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.pr-info.outputs.branch }}"
          SAFE_BRANCH=$(echo "$BRANCH" | tr '/' '-' | sed 's/[^a-zA-Z0-9-]/-/g' | cut -c1-40)
          EXISTING=$(gh pr list -R "${{ github.repository }}" \
            --json number,headRefName --state open \
            | jq -r ".[] | select(.headRefName | startswith(\"fix/ci-${SAFE_BRANCH}-\")) | .number" \
            | head -1)
          if [ -n "$EXISTING" ]; then
            gh pr close "$EXISTING" -R "${{ github.repository }}" \
              --comment "♻️ Superseded — batch re-run will create a fresh fix PR."
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr-info.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.AUTOFIX_PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      # Pinned by the COMMIT this workflow ran from, never by `main` (R2/§5.1). The template
      # violated exactly the invariant autofix-callable.yml enforces: a caller invoking it by a
      # moving branch would execute whatever main happened to hold. The refusal to fall back is
      # deliberate — a silent fallback to `main` is how a gate stops being a gate.
      #
      # R1: it downloaded ONE file and "proved" it with `node --check`, which never resolves
      # imports — the day autofix.mjs gained its first relative import this template would run a
      # script that cannot start behind a green check. It also downloaded to $RUNNER_TEMP and then
      # ran `/tmp/autofix.mjs`, two different paths on a GitHub runner. Same mechanism as the
      # reusable workflows now: the whole pinned tree, so every import comes with it.
      # R1 (pr-autofix#61) — THE CHECK RUNS BEFORE ANY WRITE. actions/checkout RESOLVES `path`
      # AGAINST GITHUB_WORKSPACE AND REFUSES ANYTHING OUTSIDE IT (input-helper.ts:42-52:
      # "Repository path … is not under …"). The earlier claim that `path` is taken verbatim was
      # wrong, and that error is what produced the defect: with containment, delivery can only be
      # pointed outside the consumer by scoping GITHUB_WORKSPACE — which the Materialize step
      # below does for its own process only (its absolute `path` is the fail-safe pair: drop the
      # env and checkout refuses loudly instead of writing into the consumer root) — the same
      # separation of roots as the callable workflows: the consumer root keeps exactly what the
      # consumer owns. Autofix stages with `git add -A` here too — a tool tree in the root would
      # become an unsolicited gitlink in the fix commit. This step keeps the REAL GITHUB_WORKSPACE:
      # what can already sit in the target on a self-hosted runner is refused loudly — a symlink
      # or a directory without `.git` is not our checkout, and checkout@v4 would clear its
      # contents — never silently overwritten.
      - name: Delivery target is outside the consumer tree
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/pr-autofix"
          case "$target/" in
            "$GITHUB_WORKSPACE/"*) echo "::error::the tool target $target is inside the consumer tree — refusing"; exit 1 ;;
          esac
          if [ -L "$target" ] || { [ -e "$target" ] && [ ! -d "$target/.git" ]; }; then
            echo "::error::$target exists and is not a tool checkout — refusing to overwrite it"
            exit 1
          fi

      - name: Materialize the pinned tool tree
        uses: actions/checkout@v4
        env:
          GITHUB_WORKSPACE: ${{ runner.temp }}
        with:
          repository: trained-assist/pr-autofix
          ref: ${{ github.workflow_sha }}
          path: ${{ runner.temp }}/pr-autofix
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run autofix (batch mode)
        continue-on-error: true
        env:
          LLM_LADDER_TOKEN: ${{ secrets.LLM_LADDER_TOKEN }}
          GH_TOKEN: ${{ secrets.AUTOFIX_PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          RUN_ID: '0'
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.pr }}
          ORIGINAL_BRANCH: ${{ steps.pr-info.outputs.branch }}
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/pr-autofix/scripts/autofix.mjs" ]; then
            echo "::error::the pinned tool tree is not in the runner temp — refusing to run autofix"
            exit 1
          fi
          node "$RUNNER_TEMP/pr-autofix/scripts/autofix.mjs"

      - name: Upload stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-fix-stats-pr${{ matrix.pr }}-run${{ github.run_id }}
          path: ci-fixer-stats.json
          if-no-files-found: ignore
          retention-days: 90
