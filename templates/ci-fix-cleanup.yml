name: CI-Fix Cleanup

# When a fix/ci-* PR is merged, automatically close the original broken PR.
# Copy this file into your .github/workflows/ directory.

on:
  pull_request:
    types: [closed]

permissions:
  pull-requests: write

jobs:
  close-original:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'fix/ci-')
    runs-on: ubuntu-latest
    steps:
      - name: Close original PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_PR: ${{ github.event.pull_request.number }}
          NEW_PR_URL: ${{ github.event.pull_request.html_url }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          ORIG_PR=$(echo "$BODY" | grep -oP '<!-- ci-fixer-original-pr: \K\d+' || true)
          if [ -z "$ORIG_PR" ]; then
            echo "No ci-fixer-original-pr marker found — nothing to close"
            exit 0
          fi
          # An unreachable API is NOT the same fact as a closed PR. The previous line folded both
          # into "NOT_FOUND" via `|| echo`, so a network failure read as "nothing to do" and the
          # step went green — the R4 class, fail-open around a network call (§5.4).
          if ! STATE=$(gh pr view "$ORIG_PR" -R "${{ github.repository }}" --json state -q '.state'); then
            echo "::error::could not read PR #$ORIG_PR from the API — refusing to report it as closed"
            exit 1
          fi
          if [ "$STATE" != "OPEN" ]; then
            echo "Original PR #$ORIG_PR is $STATE — nothing to do"
            exit 0
          fi
          gh pr comment "$ORIG_PR" -R "${{ github.repository }}" --body \
            "🤖 Superseded by #${NEW_PR} (${NEW_PR_URL}), which has been merged. Closing this PR."
          gh pr close "$ORIG_PR" -R "${{ github.repository }}"
          echo "Closed original PR #$ORIG_PR"
